services:
  - type: web
    name: fdaapproval
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_RUNS
        value: "on"
      - key: RUN_LIMIT
        value: "6"
      - key: RUN_WINDOW_MS
        value: "600000"
      - key: RUN_CONCURRENCY
        value: "1"
      - key: PAPERCLIP_API_KEY
        sync: false
      - key: PAPERCLIP_MCP_URL
        value: https://paperclip.gxl.ai/mcp
      - key: MODEL_PROVIDER
        value: anthropic
      - key: MODEL_NAME
        value: claude-opus-5
      - key: MODEL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: EVAL_EFFORT
        value: high
      - key: EXTRACT_EFFORT
        value: low
      - key: AUDIT_STORE
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: fdaapproval
      - key: MONGODB_AUDITS_COLLECTION
        value: evaluation_audits
      - key: MODAL_API_TOKEN
        sync: false
      - key: MODAL_TOKEN_ID
        sync: false
      - key: MODAL_TOKEN_SECRET
        sync: false
      - key: MODAL_GROUND_URL
        value: https://inference.us-west.modal.direct
      - key: MODAL_GROUND_MODE
        value: openai
      - key: MODAL_GROUND_MODEL
        value: sameernagar-hub--ep-kimi-k3-server.us-west.modal.direct
      - key: MODAL_FOLD_URL
        sync: false
      - key: MODAL_FOLD_MODE
        value: json
